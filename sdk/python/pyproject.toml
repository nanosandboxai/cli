[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosandbox"
version = "0.1.0"
description = "Python SDK for the nanosandbox protocol helper"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["nanosandbox*"]
